<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#1f6feb'><link rel='manifest' href='manifest.webmanifest'><link rel='icon' href='icon.svg'><title>MonGarage</title>
<style>
:root{--bg:#f6f7f9;--c:#fff;--t:#1b1f24;--m:#667085;--p:#1f6feb;--r:#c62828;--o:#b26a00;--b:#d9dde3}
@media(prefers-color-scheme:dark){:root{--bg:#101317;--c:#1a1f26;--t:#eceff3;--m:#9aa4b2;--p:#5b9dff;--r:#ff7b72;--o:#e3a33b;--b:#2b323c}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:76px}
main{max-width:640px;margin:auto;padding:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:0 0 10px}
h1{font-size:1.2rem;margin:4px 0 12px}h2{font-size:1rem;margin:0 0 6px}
label{display:block;font-size:.85rem;color:var(--m);margin:8px 0 2px}
input,select,textarea,button{font:inherit;width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
button{background:var(--p);color:#fff;border:0;font-weight:600;cursor:pointer;width:auto;padding:10px 14px}
button.s{background:none;color:var(--p);border:1px solid var(--p)}button.d{background:none;color:var(--r);border:1px solid var(--r)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.row>*{flex:1}
.m{color:var(--m);font-size:.85rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b)}
nav button{flex:1;background:none;color:var(--m);border-radius:0;font-size:.78rem;padding:14px 2px;border:0;border-top:3px solid transparent}nav button.on{color:var(--p);border-top-color:var(--p)}
.late{color:var(--r);font-weight:700}.soon{color:var(--o);font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:4px;text-align:left;border-bottom:1px solid var(--b);font-size:.9rem}
@media print{nav,.np{display:none}body{background:#fff;color:#000}}
</style></head><body><main id='app'></main><nav id='nav'></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/\u0022/g,'&quot;');
const uid=()=>crypto.randomUUID(),today=()=>new Date().toISOString().slice(0,10);
const num=n=>(+n||0).toLocaleString('fr-FR');
const CATS=['vidange','filtre','pneus','freins','batterie','révision','réparation','contrôle administratif','autre'];
const ST={v:'vehicles',e:'entries',r:'reminders'};
let db,S={v:[],e:[],r:[]},tab='home',vid=null,cf='',yf='',cur=localStorage.cur||'MGA';
const openDb=()=>new Promise((ok,ko)=>{const q=indexedDB.open('mongarage',1);q.onupgradeneeded=()=>{for(const n of Object.values(ST))q.result.createObjectStore(n,{keyPath:'id'})};q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)});
const tx=(k,m,f)=>new Promise((ok,ko)=>{const t=db.transaction(ST[k],m),r=f(t.objectStore(ST[k]));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error)});
const load=async()=>{for(const k in ST)S[k]=await tx(k,'readonly',s=>s.getAll())};
const save=async(k,o)=>{o.version=(o.version||0)+1;o.updated_at=new Date().toISOString();await tx(k,'readwrite',s=>s.put(o));await load()};
const rm=async(k,id)=>{await tx(k,'readwrite',s=>s.delete(id));await load()};
const V=()=>S.v.find(x=>x.id===vid)||S.v.find(x=>x.status==='actif');
const cu=e=>(S.v.find(x=>x.id===e.vehicle_id)||{}).currency||cur;
const fm=(n,c)=>n==null?'montant inconnu':num(n)+' '+c;
const st=(r,v)=>{if(!r.active)return['','Terminé'];if((r.due_date&&r.due_date<=today())||(r.due_km&&v.km>=r.due_km))return['late','EN RETARD'];if((r.due_date&&new Date(r.due_date)-Date.now()<30*864e5)||(r.due_km&&r.due_km-v.km<=500))return['soon','Bientôt'];return['','À venir']};
const vsel=()=>`<label>Véhicule</label><select id='vs'>${S.v.filter(x=>x.status==='actif').map(x=>`<option value='${x.id}' ${V()&&V().id===x.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`;
const emp=()=>`<h1>MonGarage</h1><div class='card'>Aucun véhicule actif. Ajoutez votre première voiture ou moto.</div><button data-t='veh'>Ajouter un véhicule</button>`;
const rline=(r,b)=>{const v=S.v.find(x=>x.id===r.vehicle_id),[c,l]=st(r,v);return `<div class='card'><b>${esc(r.title)}</b> <span class='${c}'>${l}</span><div class='m'>${r.due_date?'Avant le '+esc(r.due_date):''}${r.due_date&&r.due_km?' ou ':''}${r.due_km?'à '+num(r.due_km)+' km':''}</div>${b?`<div class='row'>${r.active?`<button data-a='doneR' data-id='${r.id}'>Fait</button>`:''}<button class='d' data-a='delR' data-id='${r.id}'>Supprimer</button></div>`:''}</div>`};
const eline=(e,d)=>`<div class='card'><b>${esc(e.title)}</b><div class='m'>${esc(e.date)} · ${num(e.km)} km · ${fm(e.amount,esc(cu(e)))}${e.garage?' · '+esc(e.garage):''}</div>${e.notes?`<div>${esc(e.notes)}</div>`:''}${d?`<div class='row'><button class='d' data-a='delE' data-id='${e.id}'>Supprimer</button></div>`:''}</div>`;
const TABS=[['home','Accueil'],['jrn','Journal'],['add','＋ Ajouter'],['rem','Rappels'],['more','Plus']];
const VW={
home(){const v=V();if(!v)return emp();const old=!v.km_date||Date.now()-new Date(v.km_date)>30*864e5;const rs=S.r.filter(r=>r.vehicle_id===v.id&&r.active).sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999')).slice(0,3);const es=S.e.filter(e=>e.vehicle_id===v.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
return `<h1>MonGarage</h1>${vsel()}<div class='card'><h2>${num(v.km)} km</h2><div class='m'>Relevé du ${esc(v.km_date||'?')}${old?' <b class=soon>— kilométrage à actualiser</b>':''}</div><div class='row'><input id='nk' type='number' inputmode='numeric' placeholder='Nouveau relevé km'><button data-a='setKm'>Mettre à jour</button></div></div><button data-t='add' style='width:100%'>＋ Ajouter une intervention</button><h2 style='margin-top:14px'>Échéances</h2>${rs.map(r=>rline(r)).join('')||'<div class=m>Aucune échéance.</div>'}<h2>Dernières interventions</h2>${es.map(e=>eline(e)).join('')||'<div class=m>Aucune intervention.</div>'}<p class='m'>Données stockées uniquement sur cet appareil : pensez à exporter une sauvegarde (Plus, Réglages).</p>`},
add(){const v=V();if(!v)return emp();return `<h1>Nouvelle intervention</h1>${vsel()}<label>Date</label><input id='d' type='date' value='${today()}'><label>Kilométrage</label><input id='k' type='number' inputmode='numeric' value='${v.km}'><label>Catégorie</label><select id='c'>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><label>Titre (facultatif)</label><input id='t'><label>Coût en ${esc(v.currency)} (facultatif)</label><input id='a' type='number' inputmode='numeric'><label>Garage ou mécanicien (facultatif)</label><input id='g'><label>Notes</label><textarea id='n' rows='2'></textarea><p><button data-a='saveE'>Enregistrer</button></p>`},
jrn(){const v=V();if(!v)return emp();const l=S.e.filter(e=>e.vehicle_id===v.id&&(!cf||e.category===cf)).sort((a,b)=>b.date.localeCompare(a.date)||b.km-a.km);return `<h1>Journal</h1>${vsel()}<label>Catégorie</label><select id='cf'><option value=''>Toutes</option>${CATS.map(c=>`<option ${c===cf?'selected':''}>${c}</option>`).join('')}</select><div style='margin-top:10px'>${l.map(e=>eline(e,1)).join('')||'<div class=m>Aucune intervention.</div>'}</div>`},
rem(){const v=V();if(!v)return emp();const l=S.r.filter(r=>r.vehicle_id===v.id).sort((a,b)=>(b.active-a.active)||(a.due_date||'9999').localeCompare(b.due_date||'9999'));return `<h1>Rappels</h1>${vsel()}${l.map(r=>rline(r,1)).join('')||'<div class=m>Aucun rappel.</div>'}<div class='card'><h2>Nouveau rappel</h2><label>Titre</label><input id='rt'><label>Échéance (date)</label><input id='rd' type='date'><label>Échéance (km)</label><input id='rk' type='number' inputmode='numeric'><label>Répéter tous les (mois)</label><input id='rm' type='number' inputmode='numeric'><label>Répéter tous les (km)</label><input id='ri' type='number' inputmode='numeric'><p><button data-a='saveR'>Créer</button></p><div class='m'>Rappels visibles dans l'application uniquement : aucune notification quand elle est fermée.</div></div>`},
dep(){const v=V();if(!v)return emp();const ys=[...new Set(S.e.filter(e=>e.vehicle_id===v.id).map(e=>e.date.slice(0,4)))].sort().reverse();const l=S.e.filter(e=>e.vehicle_id===v.id&&(!yf||e.date.startsWith(yf)));const by={};let t=0,u=0;for(const e of l){if(e.amount==null){u++;continue}by[e.category]=(by[e.category]||0)+e.amount;t+=e.amount}const ks=l.map(e=>e.km),sp=ks.length>1?Math.max(...ks)-Math.min(...ks):0;
return `<h1>Dépenses</h1>${vsel()}<label>Période</label><select id='ys'><option value=''>Toutes</option>${ys.map(y=>`<option ${y===yf?'selected':''}>${y}</option>`).join('')}</select><div class='card'><h2>Total : ${fm(t,esc(v.currency))}</h2><table>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,m])=>`<tr><td>${esc(c)}</td><td>${fm(m,esc(v.currency))}</td></tr>`).join('')}</table>${u?`<div class='m'>${u} intervention(s) sans coût connu, non comptée(s).</div>`:''}${sp>0&&t?`<div class='m'>Estimation : ${num(Math.round(t/sp))} ${esc(v.currency)}/km sur ${num(sp)} km (montants connus de la période).</div>`:''}</div>`},
veh(){return `<h1>Véhicules</h1>${S.v.map(v=>`<div class='card'><b>${esc(v.label)}</b> <span class='m'>${esc(v.type)} · ${esc(v.status)} · ${num(v.km)} km${v.plate?' · '+esc(v.plate):''}</span><div class='row'><button class='s' data-a='arch' data-id='${v.id}'>${v.status==='actif'?'Archiver':'Réactiver'}</button><button class='d' data-a='delV' data-id='${v.id}'>Supprimer</button></div></div>`).join('')}<div class='card'><h2>Ajouter un véhicule</h2><label>Type</label><select id='vt'><option>voiture</option><option>moto</option><option>scooter</option><option>utilitaire</option></select><label>Marque / modèle</label><input id='vl'><label>Kilométrage actuel</label><input id='vk' type='number' inputmode='numeric'><label>Année (facultatif)</label><input id='vy' type='number' inputmode='numeric'><label>Immatriculation (facultatif)</label><input id='vp'><label>Devise</label><input id='vc' value='${esc(cur)}'><p><button data-a='addV'>Ajouter</button></p></div>`},
set(){return `<h1>Réglages</h1><div class='card'><h2>Sauvegarde</h2><p class='m'>Vos données sont uniquement sur cet appareil. Dernière sauvegarde : ${esc(localStorage.bk||'jamais')}.</p><div class='row'><button data-a='exJ'>Export JSON</button><button class='s' data-a='exC'>Export CSV</button></div><label>Importer une sauvegarde JSON (fusion)</label><input id='fi' type='file' accept='.json,application/json'><p><button class='s' data-a='persist'>Protéger le stockage</button></p></div><div class='card'><h2>Dossier de revente</h2><button data-t='prt'>Vue imprimable (PDF)</button></div><div class='card'><h2>Devise par défaut</h2><input id='dc' value='${esc(cur)}'><p><button class='s' data-a='setCur'>Enregistrer</button></p></div>`},
prt(){const v=V();if(!v)return emp();const l=S.e.filter(e=>e.vehicle_id===v.id).sort((a,b)=>a.date.localeCompare(b.date));return `<div class='np'>${vsel()}<p><button data-a='print'>Imprimer / Enregistrer en PDF</button></p></div><h1>Dossier d'entretien — ${esc(v.label)}</h1><p>${esc(v.type)}${v.year?' · '+esc(v.year):''}${v.plate?' · '+esc(v.plate):''} · ${num(v.km)} km (relevé du ${esc(v.km_date||'?')})</p><table><tr><th>Date</th><th>Km</th><th>Intervention</th><th>Montant</th><th>Garage</th></tr>${l.map(e=>`<tr><td>${esc(e.date)}</td><td>${num(e.km)}</td><td>${esc(e.title)}</td><td>${e.amount==null?'—':num(e.amount)+' '+esc(v.currency)}</td><td>${esc(e.garage)}</td></tr>`).join('')}</table><p class='m'>Historique déclaré par l'utilisateur, non certifié. Généré le ${today()}.</p>`},
more(){return `<h1>Plus</h1><div class='row'><button data-t='dep'>Dépenses</button><button data-t='veh'>Véhicules</button><button data-t='set'>Réglages</button></div>`}
};
const go=()=>{$('#app').innerHTML=VW[tab]();$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t='${k}' class='${tab===k||(k==='more'&&['dep','veh','set','prt'].includes(tab))?'on':''}'>${l}</button>`).join('');scrollTo(0,0)};
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const q=x=>{let s=String(x==null?'':x);if(/^[=+\-@]/.test(s)&&isNaN(s))s="'"+s;return '\u0022'+s.replace(/\u0022/g,'\u0022\u0022')+'\u0022'};
async function imp(f){try{const d=JSON.parse(await f.text());if(d.app!=='mongarage')throw 0;for(const k of ['v','e','r'])for(const o of d[k]||[])await tx(k,'readwrite',s=>s.put(o));await load();alert('Import terminé.');go()}catch(x){alert('Fichier invalide.')}}
const A={
async setKm(){const v=V(),k=$('#nk').value;if(k===''||isNaN(+k))return;if(+k<v.km&&!confirm('Inférieur au relevé précédent ('+num(v.km)+' km). Corriger quand même ?'))return;v.km=+k;v.km_date=today();await save('v',v);go()},
async saveE(){const v=V(),d=$('#d').value,k=$('#k').value;if(!d||k===''||isNaN(+k)){alert('Date et kilométrage requis.');return}const km=+k;if(km<v.km&&!confirm('Kilométrage inférieur au dernier relevé ('+num(v.km)+' km). Enregistrer quand même ?'))return;const c=$('#c').value,a=$('#a').value;await save('e',{id:uid(),vehicle_id:v.id,date:d,km,category:c,title:$('#t').value.trim()||c,amount:a===''?null:Math.round(+a),garage:$('#g').value.trim(),notes:$('#n').value.trim(),source:'déclaré'});if(km>=v.km){v.km=km;v.km_date=d;await save('v',v)}tab='jrn';go()},
async delE(id){if(confirm('Supprimer cette intervention ?')){await rm('e',id);go()}},
async saveR(){const v=V(),t=$('#rt').value.trim(),d=$('#rd').value,k=$('#rk').value;if(!t||(!d&&!k)){alert('Titre et au moins une échéance (date ou km) requis.');return}await save('r',{id:uid(),vehicle_id:v.id,title:t,due_date:d||null,due_km:k?+k:null,interval_months:+$('#rm').value||null,interval_km:+$('#ri').value||null,active:true});go()},
async doneR(id){const r=S.r.find(x=>x.id===id),v=S.v.find(x=>x.id===r.vehicle_id);if((r.interval_months||r.interval_km)&&confirm('Recalculer la prochaine échéance ?')){let dd=null;if(r.interval_months){const d=new Date();d.setMonth(d.getMonth()+r.interval_months);dd=d.toISOString().slice(0,10)}r.due_date=dd;r.due_km=r.interval_km?v.km+r.interval_km:null}else r.active=false;await save('r',r);go()},
async delR(id){if(confirm('Supprimer ce rappel ?')){await rm('r',id);go()}},
async addV(){const l=$('#vl').value.trim(),k=$('#vk').value;if(!l||k===''||isNaN(+k)){alert('Libellé et kilométrage requis.');return}const o={id:uid(),type:$('#vt').value,label:l,km:+k,km_date:today(),year:$('#vy').value||null,plate:$('#vp').value.trim(),currency:$('#vc').value.trim()||'MGA',status:'actif'};await save('v',o);vid=o.id;go()},
async arch(id){const v=S.v.find(x=>x.id===id);v.status=v.status==='actif'?'archivé':'actif';await save('v',v);go()},
async delV(id){if(!confirm('Supprimer ce véhicule et tout son historique ?'))return;for(const e of S.e.filter(x=>x.vehicle_id===id))await rm('e',e.id);for(const r of S.r.filter(x=>x.vehicle_id===id))await rm('r',r.id);await rm('v',id);go()},
exJ(){dl('mongarage-'+today()+'.json',JSON.stringify({app:'mongarage',schema:1,exported_at:new Date().toISOString(),v:S.v,e:S.e,r:S.r}),'application/json');localStorage.bk=today();go()},
exC(){const rows=[['véhicule','date','km','catégorie','titre','montant','devise','garage','notes']];for(const e of S.e.slice().sort((a,b)=>a.date.localeCompare(b.date))){const v=S.v.find(x=>x.id===e.vehicle_id)||{};rows.push([v.label,e.date,e.km,e.category,e.title,e.amount,v.currency,e.garage,e.notes])}dl('interventions-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv')},
print(){window.print()},
async persist(){const ok=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false;alert(ok?'Stockage protégé.':'Non accordé par le navigateur : exportez régulièrement une sauvegarde.')},
setCur(){cur=$('#dc').value.trim()||'MGA';localStorage.cur=cur;go()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;return go()}const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.id)});
document.addEventListener('change',e=>{const i=e.target.id;if(i==='vs'){vid=e.target.value;go()}else if(i==='cf'){cf=e.target.value;go()}else if(i==='ys'){yf=e.target.value;go()}else if(i==='fi'&&e.target.files[0])imp(e.target.files[0])});
(async()=>{db=await openDb();await load();go();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
